<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a1c21" />
    <title>Finite</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="logo-mark" aria-hidden="true"></span>
          <span>Finite</span>
        </div>
        <button
          id="open-tasks"
          class="tasks-button"
          type="button"
          aria-expanded="false"
          aria-controls="drawer"
        >
          Tasks
        </button>
      </header>

      <main id="stage">
        <p id="status" class="status" hidden></p>
        <h1>Your time, intentionally spent.</h1>
        <button id="new-task" class="new-task" type="button">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M8 2.5v11M2.5 8h11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
          New task
        </button>
        <p id="empty" class="empty-note" hidden>Add a task to put a countdown on the board.</p>
        <div id="list" class="list"></div>
      </main>

      <footer class="footer">Finite.</footer>
    </div>

    <div id="backdrop" class="backdrop"></div>

    <aside
      id="drawer"
      class="drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawer-title"
      aria-hidden="true"
      inert
    >
      <div class="drawer-header">
        <h2 id="drawer-title">New task</h2>
        <button id="close-drawer" class="close-button" type="button" aria-label="Close">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path
              d="M3.2 3.2l9.6 9.6M12.8 3.2l-9.6 9.6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.25"
            />
          </svg>
        </button>
      </div>

      <form id="task-form" class="task-form" autocomplete="off">
        <label>
          Title
          <input id="title" name="title" type="text" required maxlength="120" placeholder="Ship MVP" />
        </label>
        <label>
          Target
          <input id="target" name="target" type="datetime-local" step="1" required />
        </label>
        <p id="form-error" class="form-error" role="alert" hidden></p>
        <div class="form-actions">
          <button id="save-task" class="submit" type="submit">Add task</button>
          <button id="cancel-edit" class="text-button" type="button" hidden>Cancel</button>
        </div>
      </form>

      <ul id="task-list" class="task-list"></ul>
    </aside>

    <p id="live-summary" class="sr-only" aria-live="polite"></p>
    <script src="app.js"></script>
  </body>
</html>
